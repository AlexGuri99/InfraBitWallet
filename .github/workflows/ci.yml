name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PNPM_VERSION: '9'
  NODE_VERSION: '22.22.2'

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Build hash
        id: build_hash
        run: echo "hash=$(sha256sum apps/miniapp/dist/index.html | cut -d' ' -f1)" >> $GITHUB_OUTPUT

      - name: License scan
        run: npx license-checker --summary --production --onlyAllow 'MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;CC0-1.0;CC-BY-3.0;CC-BY-4.0;Unlicense' --excludePrivatePackages

      - name: E2E tests
        run: npx playwright install --with-deps && pnpm test:e2e

      - name: Audit
        run: pnpm audit --audit-level=high
        continue-on-error: true
        id: audit

      - name: Check formatting
        run: pnpm format:check

      - name: Notify audit failures
        if: steps.audit.outcome == 'failure'
        run: echo "::warning::pnpm audit found high or critical vulnerabilities. Review needed."